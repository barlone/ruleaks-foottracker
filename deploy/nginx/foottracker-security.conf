# Заголовки безопасности RuLeaks.Следопыт (аудит, пункты 7 и 8). Подключается через include:
#   — на уровне server { } — для всех location без своих add_header (/trpc/, /geo/, /scans/);
#   — и ВНУТРИ каждого location, где есть свой add_header (например, location / с Cache-Control):
#     nginx наследует add_header с уровня выше, только если в location нет ни одного своего.
# «always» — заголовки и на ответах с ошибкой (4xx/5xx).

# Встраивать сайт в чужие страницы нельзя (clickjacking). frame-ancestors в CSP ниже — то же для новых браузеров.
add_header X-Frame-Options "DENY" always;

# Браузер не угадывает тип содержимого (картинка из /scans не исполнится как скрипт или HTML).
add_header X-Content-Type-Options "nosniff" always;

# Пункт 8: адрес страницы (в нём id досье, параметры поиска — запрос с ФИО, телефоном) не уходит на чужие сайты —
# ни при переходе по ссылке, ни при загрузке внешней картинки. IP зрителя внешней картинки это не скрывает.
add_header Referrer-Policy "no-referrer" always;

# Сайту не нужны камера, микрофон, геолокация браузера, платежи, USB. Буфер обмена не трогаем — им пользуются сканы.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Окно сайта не делит контекст с окнами, открытыми с других сайтов (window.opener).
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HTTPS на год. Сайт открывают только по https через Cloudflare; includeSubDomains не ставим — не наше дело за поддомены.
add_header Strict-Transport-Security "max-age=31536000" always;

# Content-Security-Policy. Источники, которые нужны сайту:
#   script-src  'self'                   — только свой бандл (тема — /theme-init.js, inline-скриптов нет);
#   style-src   'unsafe-inline'          — style="…" у React-компонентов, React Flow, MapLibre; плюс Google Fonts;
#   font-src    fonts.gstatic.com        — шрифты JetBrains Mono / Manrope;
#   img-src     https: data: blob:       — data URL медиа, миниатюры Гугл-диска (→ *.googleusercontent.com),
#                                          фото профилей Google, внешние картинки медиа досье, blob: — карта, сканы;
#   connect-src 'self'                   — /trpc, /geo (тайлы с Range), /scans; если в [geo-search] tiles/assets
#                                          стоят https-адреса — добавить их сюда;
#   worker-src  'self' blob:             — воркер MapLibre;
#   frame-src   drive.google.com         — плеер видео Гугл-диска (embedUrl — только он, проверяет и сервер);
#   frame-ancestors 'none', base-uri 'none', object-src 'none', form-action 'self' — запреты на всё прочее.
#
# Внедрять в два шага: сначала строку ниже с Content-Security-Policy-Report-Only (ничего не блокирует, нарушения
# видны в консоли браузера), пройтись по разделам сайта, затем заменить имя заголовка на Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; frame-src https://drive.google.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

# Пункт 8, строгий вариант img-src: картинки только свои, data:/blob: и с Гугл-диска / Google. Тогда внешний сервер
# не узнает IP и время просмотра досье коллегой, но внешние картинки в медиа перестанут показываться
# (на проде их 3: dossier.center, archive.is, occrp.org — их стоит перезалить файлами или положить на Диск).
# Для этого в строке CSP выше заменить «img-src 'self' data: blob: https:;» и «media-src …;» на:
#   img-src 'self' data: blob: https://drive.google.com https://*.googleusercontent.com https://*.ggpht.com; media-src 'self' data: blob:;
