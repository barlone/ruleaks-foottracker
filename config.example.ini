; RuLeaks.Следопыт — конфигурация сервера.
;
; Скопируйте в config.ini (он в .gitignore, в git не попадает) и заполните.
; Без config.ini сервер стартует в демо-режиме со значениями по умолчанию.
;
; Любой ключ можно переопределить переменной окружения FT_<СЕКЦИЯ>_<КЛЮЧ>
; (дефисы → подчёркивания), например:
;   [project-db] password  →  FT_PROJECT_DB_PASSWORD
;   [server] port          →  FT_SERVER_PORT
; Другой путь к файлу — FT_CONFIG=/etc/foottracker/config.ini
;
; Пароли держите только в config.ini или в переменных окружения.

[config]
; Способ входа на сайт: none | password-sha256 | bot-db
;   bot-db          — через Telegram-бота RuLeaks: подписка и токен API из базы бота (секция [bot-db]);
;   none            — без входа, «соло»: один пользователь на своём компьютере. Только при [server] host = 127.0.0.1 / localhost;
;   password-sha256 — один пользователь, вход по паролю (его sha256 — ключ password-sha256 ниже).
; В режимах none и password-sha256 подписка не проверяется, [bot-db] и dev-login не используются,
; а для реального поиска ([api] enabled = true) нужен [api] token.
auth = bot-db
; sha256 пароля в hex (64 символа) для auth = password-sha256. Получить: npm run password-hash
; Смена пароля завершает все открытые сессии.
password-sha256 =
; Пользователь соло-режима (none / password-sha256): его Telegram ID и имя на сайте.
; Укажите свой Telegram ID, чтобы видеть досье и расследования, созданные при входе через бота.
; В демо-режиме ([project-db] enabled = false) демо-досье принадлежат пользователю 100000001.
user-tg-id = 0
user-name = Следопыт

[server]
host = 127.0.0.1
port = 3001
; Подпись cookie сессии: длинная случайная строка. Обязательна (не короче 32 символов),
; если host — не localhost.
cookie-secret =
; Вход без бота (только при [config] auth = bot-db): пока бот не умеет подтверждать вход на сайт, на странице входа можно
; указать Telegram ID пользователя бота (при [bot-db] enabled) или выбрать демо-учётку.
; Работает только при host = 127.0.0.1 / localhost.
dev-login = true
session-ttl-days = 30

[telegram]
; Бот, через который идёт вход: ссылка t.me/<bot-username>?start=login_<код>
bot-username = ruleaks_bot

; ---------------------------------------------------------------------------
; 1) База данных сайта: досье, расследования, медиа, доступы, сессии.
;    Схема — packages/db/src/schema.ts. Отдельная база и роль-владелец.
; ---------------------------------------------------------------------------
[project-db]
; false — досье и расследования хранятся в памяти (демо-данные, сбрасываются при перезапуске).
; true — PostgreSQL: пользователи, сессии, история поиска, досье, расследования.
; Сервер не стартует, если в базе применены не все миграции (npm run db -- status).
enabled = false
host = 127.0.0.1
port = 5432
database = ruleaksfoottracker
user = ruleaksfoottracker
password =
; Семантика libpq: disable | allow | prefer | require | verify-ca | verify-full
sslmode = prefer
pool-max = 10
connect-timeout-sec = 3

; ---------------------------------------------------------------------------
; 2) База Telegram-бота pyruleaks-bot: пользователи (users), токены (tokens),
;    подписки (users.subscribed_to). Та же база, что [tokens-db] у API-шлюза.
;    Подключение открывается только на чтение (default_transaction_read_only).
; ---------------------------------------------------------------------------
[bot-db]
; false — имитация бота с демо-учётками; true — подписка и токен API из базы бота.
enabled = false
host =
port = 5432
database =
user =
password =
sslmode = prefer
pool-max = 5
connect-timeout-sec = 3

; ---------------------------------------------------------------------------
; 3) API-сервер dsstalker-api-gate. При [config] auth = bot-db запросы идут с токеном
;    самого пользователя (из БД бота); в соло-режиме — с токеном из ключа token.
; ---------------------------------------------------------------------------
[api]
; false — имитация шлюза с вымышленными данными; true — реальный поиск.
enabled = false
base-url = https://api.dsstalker.online
; Шлюз пропускает с одного токена не чаще одного запроса за это время
; ([limits] min-msec-between-reqs в его config.ini). Клиент выдерживает интервал сам.
min-interval-ms = 1000
; Таймаут одного HTTP-запроса к шлюзу.
timeout-sec = 30
; Как часто сервер опрашивает job.results у тяжёлых поисков.
poll-interval-ms = 1500
; Сколько ждать тяжёлый поиск, прежде чем пометить его как неудавшийся.
job-timeout-sec = 300
; UUID-токен API (как в боте) для [config] auth = none | password-sha256; при bot-db не используется.
token =
