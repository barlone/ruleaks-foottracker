; RuLeaks.Следопыт — конфигурация сервера.
;
; Скопируйте в config.ini (он в .gitignore, в git не попадает) и заполните.
; Без config.ini сервер стартует в демо-режиме со значениями по умолчанию.
;
; Любой ключ можно переопределить переменной окружения FT_<СЕКЦИЯ>_<КЛЮЧ>
; (дефисы → подчёркивания), например:
;   [project-db] password  →  FT_PROJECT_DB_PASSWORD
;   [server] port          →  FT_SERVER_PORT
; Другой путь к файлу — FT_CONFIG=/etc/foottracker/config.ini
;
; Пароли держите только в config.ini или в переменных окружения.

[config]
; Способ входа на сайт: none | password-sha256 | bot-db
;   bot-db          — через Telegram-бота RuLeaks: подписка и токен API из базы бота (секция [bot-db]);
;   none            — без входа, «соло»: один пользователь на своём компьютере. Только при [server] host = 127.0.0.1 / localhost;
;   password-sha256 — один пользователь, вход по паролю (его sha256 — ключ password-sha256 ниже).
; В режимах none и password-sha256 подписка не проверяется, [bot-db] и dev-login не используются,
; а для реального поиска ([api] enabled = true) нужен [api] token.
auth = bot-db
; sha256 пароля в hex (64 символа) для auth = password-sha256. npm run password-hash спросит пароль
; и запишет хеш сюда (заодно предложит включить auth = password-sha256); --print — только вывести.
; Смена пароля завершает все открытые сессии.
password-sha256 =
; Пользователь соло-режима (none / password-sha256): его Telegram ID и имя на сайте.
; Укажите свой Telegram ID, чтобы видеть досье и расследования, созданные при входе через бота.
; В демо-режиме ([project-db] enabled = false) демо-досье принадлежат пользователю 100000001.
user-tg-id = 0
user-name = Следопыт
; Только для разработки (auth = bot-db, [server] dev-login = true на localhost): кнопка «Войти как …» на странице
; входа с этим Telegram ID пользователя бота. Пусто — кнопки нет. Значение отдаёт сервер, в сборку сайта не попадает.
bot-db-dev-quick-login-tg-id =
; Раздел «Поиск по геоданным» (карта с выбором точки и радиуса). Подложка карты — секция [geo-search].
geo-search = false
; Раздел «Поиск личных страниц»: по нику сервер опрашивает ~480 сайтов (список проекта Sherlock), по e-mail —
; сервисы из blackbird + holehe (проверка регистрации по адресу); e-mail ищется ещё и по нику из части до @.
; Запросы к сайтам идут с этого сервера. Параметры — секция [pages-search].
pages-search = true
; Раздел «Поиск по Email» (GHunt + MOSINT): отчёт по адресу почты — аккаунт Google (Gaia ID, фото, Play Игры,
; Карты, календарь), регистрации на сайтах, утечки (HIBP, BreachDirectory, Intelligence X), репутация (EmailRep),
; DNS и почтовые политики домена, его регистрация (RDAP), серверы (ipapi.co), сотрудники домена (Hunter.io),
; упоминания в вебе (DuckDuckGo). Части без ключа работают сразу, остальные — с ключами из секции [email-search].
email-search = true
; Служба архивации страниц RuLeaks.ArchiveBox (отдельный сервис в том же LXC, D:\PyProjs\RuLeaksArchiveBox):
; у ссылок досье появляются «Архив страницы» — PDF и веб-архив WACZ. false — службы нет, кнопок не видно.
; Адрес и токен службы — секция [site-archive]; без токена — имитация (вымышленные файлы).
site-archive = false
; Раздел «Поиск по Google» (перенос GHunt): аккаунт Google по Gaia ID (фото, сервисы, Карты), файл Google Drive
; (владелец и участники), точка доступа Wi-Fi по BSSID (координаты), связи сайтов и Android-приложений (Digital Asset
; Links). Запросы идут с этого сервера; Gaia ID и Drive — от имени служебного аккаунта Google (секция [google-search]),
; без мастер-токена они отвечают вымышленными данными (имитация). Wi-Fi и Digital Asset Links аккаунт не используют.
; Аккаунт по адресу почты — в «Поиске по Email» (тем же служебным аккаунтом, в общей с этим разделом очереди).
google-search = false

[server]
host = 127.0.0.1
port = 3001
; Подпись cookie сессии: длинная случайная строка. Обязательна (не короче 32 символов),
; если host — не localhost.
cookie-secret =
; Вход без бота (только при [config] auth = bot-db): пока бот не умеет подтверждать вход на сайт, на странице входа можно
; указать Telegram ID пользователя бота (при [bot-db] enabled) или выбрать демо-учётку (при [bot-db] enabled = false).
; Работает только при host = 127.0.0.1 / localhost. На проде — false: за nginx сервер обычно тоже слушает 127.0.0.1,
; и без этого любой посетитель вошёл бы без бота.
dev-login = true
session-ttl-days = 30
; Сервер стоит за обратным прокси (nginx, Cloudflare): каким прокси верить в X-Forwarded-For.
; Без этого все запросы приходят «с адреса прокси», и лимит попыток ввода пароля становится общим на всех.
;   false                — не верить заголовку;
;   127.0.0.1            — адреса/подсети прокси через запятую (10.0.0.0/8, loopback): берётся последний адрес
;                          цепочки, добавленный не ими. Для Cloudflare → nginx на этом же хосте — 127.0.0.1, а в nginx:
;                          set_real_ip_from <диапазоны Cloudflare>; real_ip_header CF-Connecting-IP;
;                          proxy_set_header X-Forwarded-For $remote_addr;
;                          (без real_ip в nginx адресом клиента окажется сервер Cloudflare).
;                          Числа прокси нет: Fastify считает число «никому не доверять».
;   true                 — верить всем: адрес берётся из самого левого значения, которое клиент пишет сам. Не использовать.
trust-proxy = false
; Флаг Secure у cookie сессии: браузер отправляет её только по HTTPS. Оставлять true и на проде (сервер там слушает
; 127.0.0.1 за nginx, но сайт открывают по HTTPS), и при разработке (http://localhost браузеры считают безопасным).
; false — только если сайт открывают по голому http не с localhost (например, по адресу в локальной сети).
secure-cookie = true

[telegram]
; Бот, через который идёт вход: ссылка t.me/<bot-username>?start=login_<код>
bot-username = ruleaks_bot
; Вход по ссылке из бота: бот по команде присылает пользователю https://<сайт>/login?tg=…&ts=…&n=…&sig=…,
; подписанную HMAC-SHA256 этим секретом (он же задаётся в конфиге бота). Случайная строка не короче 32 символов;
; пусто — вход по ссылке выключен. Формат ссылки — ARCHITECTURE.md, раздел 4.
login-secret =
; Сколько секунд ссылка действительна (она одноразовая).
login-link-ttl-sec = 180

; ---------------------------------------------------------------------------
; 1) База данных сайта: досье, расследования, медиа, доступы, сессии.
;    Схема — packages/db/src/schema.ts. Отдельная база и роль-владелец.
; ---------------------------------------------------------------------------
[project-db]
; false — досье и расследования хранятся в памяти (демо-данные, сбрасываются при перезапуске).
; true — PostgreSQL: пользователи, сессии, история поиска, досье, расследования.
; Сервер не стартует, если в базе применены не все миграции (npm run db -- status).
enabled = false
host = 127.0.0.1
port = 5432
database = ruleaksfoottracker
user = ruleaksfoottracker
password =
; Семантика libpq: disable | allow | prefer | require | verify-ca | verify-full
sslmode = prefer
pool-max = 10
connect-timeout-sec = 3

; ---------------------------------------------------------------------------
; 2) База Telegram-бота pyruleaks-bot: пользователи (users), токены (tokens),
;    подписки (users.subscribed_to). Та же база, что [tokens-db] у API-шлюза.
;    Подключение открывается только на чтение (default_transaction_read_only).
; ---------------------------------------------------------------------------
[bot-db]
; false — имитация бота с демо-учётками; true — подписка и токен API из базы бота.
enabled = false
host =
port = 5432
database =
user =
password =
sslmode = prefer
pool-max = 5
connect-timeout-sec = 3

; ---------------------------------------------------------------------------
; 3) API-сервер dsstalker-api-gate. При [config] auth = bot-db запросы идут с токеном
;    самого пользователя (из БД бота); в соло-режиме — с токеном из ключа token.
; ---------------------------------------------------------------------------
[api]
; false — имитация шлюза с вымышленными данными; true — реальный поиск.
enabled = false
base-url = https://api.dsstalker.online
; Шлюз пропускает с одного токена не чаще одного запроса за это время
; ([limits] min-msec-between-reqs в его config.ini). Клиент выдерживает интервал сам.
min-interval-ms = 1000
; Таймаут одного HTTP-запроса к шлюзу.
timeout-sec = 30
; Как часто сервер опрашивает job.results у тяжёлых поисков.
poll-interval-ms = 1500
; Сколько ждать тяжёлый поиск, прежде чем пометить его как неудавшийся.
job-timeout-sec = 300
; UUID-токен API (как в боте) для [config] auth = none | password-sha256; при bot-db не используется.
token =

; ---------------------------------------------------------------------------
; 4) Карта поиска по геоданным (при [config] geo-search = true).
; ---------------------------------------------------------------------------
[geo-search]
; Подложка карты: raster | pmtiles
;   raster  — растровые тайлы публичного сервера (raster-url). Только для разработки: правила
;             tile.openstreetmap.org не допускают продакшен-нагрузку, и сервер тайлов видит, какие районы смотрят;
;   pmtiles — свои векторные тайлы Protomaps (файл .pmtiles) + шрифты и спрайты, рисует MapLibre GL.
;             Как подготовить файл — tools/geo/README.md.
tiles = raster
; tiles = raster: шаблон адреса тайлов и подпись об авторстве (HTML; без символов ; и # — в ini это комментарий).
raster-url = https://tile.openstreetmap.org/{z}/{x}/{y}.png
raster-attribution = © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>
; tiles = pmtiles: путь к файлу .pmtiles на этом сервере — сервер отдаёт его по /geo/tiles.pmtiles только вошедшим
; пользователям. Для проверки в разработке можно указать https-адрес сборки Protomaps (браузер ходит туда сам):
;   pmtiles = https://build.protomaps.com/20261007.pmtiles
pmtiles = /srv/foottracker/geo/europe-russia.pmtiles
; Каталог basemaps-assets (подкаталоги fonts/ и sprites/) — сервер отдаёт его по /geo/assets/. Или https-адрес:
;   assets = https://protomaps.github.io/basemaps-assets
assets = /srv/foottracker/geo/basemaps-assets
; Язык подписей векторной карты (ru, en, de…).
lang = ru
; Максимальный зум карты. Векторные тайлы в файле — до зума 14 (tools/geo), дальше MapLibre увеличивает их без потери качества.
max-zoom = 17

; ---------------------------------------------------------------------------
; 5) Хранилище сканов документов scanstore-api-gate. В записях утечек поиск отдаёт ключ scans —
;    uuid сканов; «Поиск по атрибутам» показывает их превью. Браузер получает картинки только
;    через этот сервер (/scans/<uuid>, только вошедшим пользователям): токен в браузер не уходит.
;    Обратный прокси (nginx, Caddy) должен передавать /scans/ на этот сервер так же, как /trpc и /geo/.
; ---------------------------------------------------------------------------
[scanstore-api]
; false — сканы в результатах поиска не показываются.
enabled = false
url = http://127.0.0.1:8000
; api_token из config.ini хранилища (заголовок Authorization: Bearer).
token =
; Таймаут одного запроса к хранилищу.
timeout-sec = 30

; ---------------------------------------------------------------------------
; 6) Поиск личных страниц (при [config] pages-search = true): один поиск — это один запрос
;    к каждому сайту из списка, параллельно по concurrency штук. Обновить списки сайтов из upstream:
;    по нику — npm run pages-sites-update (Sherlock), по e-mail — npm run pages-email-update (blackbird).
; ---------------------------------------------------------------------------
[pages-search]
; Сколько ждать ответа одного сайта.
timeout-sec = 15
; Сколько сайтов опрашивать одновременно.
concurrency = 20
; Пробы по e-mail с побочным действием: часть сайтов из списка blackbird проверяет адрес настоящей формой
; регистрации (с паролем) или восстановления — если адрес свободен, сайт может завести учётку на цель
; или написать ей, раскрыв интерес к адресу. По умолчанию такие пробы пропускаются.
side-effect-probes = false

; ---------------------------------------------------------------------------
; 7) Поиск по Google (при [config] google-search = true) — перенос GHunt (https://github.com/mxrch/GHunt).
;    Все запросы к Google делает сервер от имени ОДНОГО служебного аккаунта. Заведите для этого отдельный
;    аккаунт Google, не личный: мастер-токен даёт доступ ко всему аккаунту, а за нетипичные запросы Google
;    может его заблокировать. Поиски идут по очереди, с паузой min-interval-sec.
; ---------------------------------------------------------------------------
[google-search]
; Мастер-токен Android служебного аккаунта (начинается с aas_et/). Получить и записать сюда:
;   npm run google-login
; Утилита спросит одноразовый oauth_token: войдите служебным аккаунтом на https://accounts.google.com/EmbeddedSetup
; и возьмите значение cookie oauth_token (oauth2_4/…); примет и готовый мастер-токен, строку расширения
; GHunt Companion или файл creds.m от GHunt. --print — только вывести токен.
; Пусто — имитация: раздел работает, но отвечает вымышленными данными.
master-token =
; Сколько ждать ответа на один запрос к Google.
timeout-sec = 20
; Пауза между поисками (сек): частые запросы Google карает капчей для адреса сервера и блокировкой аккаунта.
min-interval-sec = 3
; Адрес точки Wi-Fi по её координатам — сервис с API Nominatim (как у GHunt). Найденные координаты уходят туда:
; публичный nominatim.openstreetmap.org видит, какие точки ищут, и его правила не допускают нагрузку сервиса —
; в продакшене укажите свой экземпляр (может стоять и во внутренней сети) или оставьте пустым (адрес не определяется).
reverse-geocode = https://nominatim.openstreetmap.org

; Алертинг: ошибки сервера (необработанные ошибки обработчиков, потеря связи с базами и API-шлюзом, падение
; процесса, отказ служебного аккаунта Google) уходят тем, кто обслуживает сайт, через REST API бота blind-postman.
; Ключи — как в такой же секции API-шлюза. Секции нет — ничего не отправляется; секция с ошибкой останавливает запуск.
; Один вид ошибки уходит не чаще раза в 5 минут, повторы приходят числом. В алерт не попадает то, что искал
; пользователь, и содержимое досье: только имя обработчика и текст ошибки.
;[alerting]
;type = blindpostman
;api_url = https://postman.example.org
;api_token =
; Получатели — псевдонимы подписчика и/или группы в боте; нужен хотя бы один.
;send_to_user_alias =
;send_to_group_alias =

[email-search]
; Сколько ждать ответа одного внешнего сервиса.
timeout-sec = 20
; Части отчёта без ключа. Запросы идут с этого сервера; в скобках — что уходит стороннему сервису.
; Аккаунт Google по адресу — служебным аккаунтом из [google-search] (без мастер-токена — имитация), в общей очереди
; с «Поиском по Google» и с паузой [google-search] min-interval-sec.
google = true
; Регистрации на сайтах (адрес): те же проверки, что в «Поиске личных страниц» по e-mail, + Instagram из MOSINT;
; таймаут, параллельность и пробы с побочным действием — из [pages-search].
sites = true
; Регистрация домена (домен) через RDAP — rdap.org и сервер реестра зоны; только для своего домена.
rdap = true
; Где стоят серверы домена (их IP-адреса) — ipapi.co, без ключа до 1000 запросов в сутки; только для своего домена.
ip-geo = true
; Упоминания в вебе (адрес): HTML-выдача DuckDuckGo по точной фразе (Google без JavaScript выдачу не отдаёт).
web-mentions = true
; Дампы текстов psbdmp.ws (адрес). Выключено: на ноябрь 2026 домен сервиса не разрешается.
pastes = false
; Существует ли ящик: сервер соединяется с почтовым сервером домена (порт 25), доходит до команды RCPT TO и читает
; ответ; письмо не отправляется. Так же спрашивается заведомо случайный адрес — если принят и он, сервер принимает
; всё подряд (catch-all) и о ящике ничего сказать нельзя. Выключено, потому что:
;   - исходящий порт 25 закрыт у большинства домашних провайдеров и у многих хостингов (Hetzner, DigitalOcean, AWS) —
;     тогда в отчёте будет «нет соединения с почтовым сервером»; порт открывают по заявке в поддержку;
;   - без обратной DNS-записи (PTR) у IP сервера, SPF и чистой репутации Gmail, Outlook и Yahoo отвечают временным
;     отказом или рвут соединение — в отчёте это «не удалось проверить», а не «ящика нет»;
;   - почтовый сервер адресата видит соединение с IP этого сайта и пишет его в журнал.
smtp-check = false
; Имя в приветствии EHLO: то же, что в обратной DNS-записи (PTR) IP сервера. Пусто — имя хоста машины.
smtp-helo =
; Адрес отправителя в MAIL FROM: существующий ящик на домене, чей SPF разрешает IP сервера. Пусто — пустой
; отправитель <> (так шлют уведомления о недоставке; часть серверов на него адреса не проверяет).
smtp-from =
; Ключи сервисов (в браузер не уходят). Пусто — часть отчёта не собирается («Не проверялось» в отчёте).
; Где взять каждый ключ, планы и лимиты — docs/EMAIL_SEARCH_KEYS.md.
; Have I Been Pwned (API v3, платная подписка): https://haveibeenpwned.com/API/Key
hibp-key =
; BreachDirectory через RapidAPI: ключ RapidAPI с подпиской на API BreachDirectory. Отдаёт пароли (часто частично
; скрытые) и хеши из утечек.
breachdirectory-key =
; Intelligence X: ключ и адрес API — бесплатный ключ работает с https://free.intelx.io, платный — с https://2.intelx.io.
intelx-key =
intelx-url = https://free.intelx.io
; EmailRep.io (Sublime Security): новые ключи не выдаются (ноябрь 2026), работает только уже выданный.
emailrep-key =
; Hunter.io (поиск по домену; только для своего домена — у бесплатных почтовых сервисов сотрудников нет).
hunter-key =

[site-archive]
; Архивы страниц ([config] site-archive = true): PDF и WACZ снимает служба RuLeaks.ArchiveBox, сервер ставит
; задание, ждёт готовности и отдаёт файлы пользователю. Страницу цели открывает Chrome службы — с IP сервера.
; REST API службы; она слушает только 127.0.0.1, nginx её не проксирует.
api-url = http://127.0.0.1:5797
; Токен API службы (X-ArchiveBox-API-Key, суперпользователь ArchiveBox). Пусто — имитация.
api-key =
; Ожидание ответа одного запроса к API, секунд.
timeout-sec = 30
; Сколько ждать готовности архива, секунд; дольше — задание не удалось, его данные в службе удаляются.
job-timeout-sec = 900
; Как часто спрашивать службу о готовности, секунд.
poll-interval-sec = 3
; Сколько минут готовые файлы ждут скачивания; потом они удаляются из службы.
keep-min = 60

[google-drive]
; Сохранение архивов страниц на Google Диск пользователя ([config] site-archive = true). Каждый пользователь
; подключает свой Диск (OAuth, доступ drive.file — только к файлам, созданным Следопытом); архивы ложатся в папку
; приложения, по папке на досье. Пусто client-id — имитация: «Диск» в памяти сервера, пропадает при перезапуске.
; Проект Google Cloud: включить Google Drive API, экран согласия OAuth, клиент «Веб-приложение» с адресом возврата ниже.
client-id =
client-secret =
; Адрес возврата из Google — ровно как в настройках клиента: https://<сайт>/site-archive/google/callback
redirect-url =
; Секрет шифрования refresh-токенов в БД (не короче 32 символов). Смена — все пользователи подключают Диск заново.
token-secret =
; Папка приложения на Диске пользователя.
folder-name = RuLeaks.Следопыт — архивы
; Ожидание ответа Drive API и загрузки одного файла, секунд.
timeout-sec = 30
upload-timeout-sec = 900
